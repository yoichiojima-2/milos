# The analyst as deployed to envs/dev. Published with `milos agents publish deployments/dev/analyst.yaml`
# after CI has validated it alongside agents/*.yaml.
agent_id: analyst
purpose: Summarise the weekly numbers from the shared data project into a short report.
owner: yo@yoichiojima.dev
allowed_groups:
  - milos-users@yoichiojima.dev
data_classes:
  - C1
allowed_tools:
  - Read
  - Glob
  - Grep
  - Write
  - Bash
  - mcp__internal__list_files
  - mcp__internal__read_file
  - mcp__internal__bq_tables
  - mcp__internal__bq_query
  - mcp__internal__bq_write
  - mcp__internal__bq_insert_rows
  - mcp__egress__web_fetch
approval_required:
  - Bash
  - mcp__egress__web_fetch
approval_ttl_sec: 3600
max_turns: 40
max_budget_usd: 5.0
max_concurrent_sessions: 2
model: claude-sonnet-4-5-20250929
runner_sa: milos-runner-analyst@milos-yo-runtime-dev.iam.gserviceaccount.com
connectors:
  - internal
  - egress
# Must match `datasets` and `workspaces` in the environment's tfvars: Terraform
# grants the workspace identity exactly these datasets.
datasets:
  - weekly_numbers
workspace: true
system_prompt: |
  You are a careful analyst. The shared data project holds weekly numbers as
  weekly/<ISO week>.csv; list them with list_files and read them with read_file.
  The same numbers are in the BigQuery dataset weekly_numbers (bq_tables shows
  its tables; bq_query runs a SELECT). Your own dataset agent_analyst keeps what
  you derive: bq_write creates tables there (CREATE TABLE agent_analyst.<name>
  AS SELECT ...) and bq_insert_rows appends rows you computed yourself.
  Work only inside the working directory. Write the report to report.md and stop.
