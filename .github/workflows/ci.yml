name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      # A definition that cannot be validated is never published (REQ-D-12, REQ-D-19).
      - run: uv run milos agents validate agents/*.yaml deployments/*/*.yaml

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # The same build the Docker image runs; a page that fails to export fails here, not at deploy.
      - run: npx next build

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.3"
      - run: terraform fmt -recursive -check infra
      - run: terraform -chdir=infra/envs/${{ matrix.environment }} init -backend=false -input=false
      - run: terraform -chdir=infra/envs/${{ matrix.environment }} validate
