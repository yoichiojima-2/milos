# One agent definition. Published with `milos agents publish agents/analyst.yaml`
# after CI has validated it (`milos agents validate agents/*.yaml`).
agent_id: analyst
purpose: Summarise the weekly numbers from the shared data project into a short report.
owner: owner@example.com
allowed_groups:
  - analysts@example.com
data_classes:
  - C1
allowed_tools:
  - Read
  - Glob
  - Grep
  - Write
  - Bash
  - mcp__internal__bq_tables
  - mcp__internal__bq_query
  - mcp__internal__bq_write
  - mcp__internal__bq_insert_rows
  - mcp__egress__web_fetch
approval_required:
  - Bash
  - mcp__egress__web_fetch
approval_ttl_sec: 3600
max_turns: 40
max_budget_usd: 5.0
max_concurrent_sessions: 2
model: claude-sonnet-5@20260601
runner_sa: runner-analyst@example-runtime-dev.iam.gserviceaccount.com
connectors:
  - internal
  - egress
# BigQuery: the shared datasets of the data project the agent may read, and
# whether it gets a dataset of its own (agent_analyst) to read and write.
datasets:
  - weekly_numbers
workspace: true
system_prompt: |
  You are a careful analyst. The weekly numbers are in the BigQuery dataset
  weekly_numbers; your own dataset agent_analyst keeps what you derive. Name
  tables as dataset.table. Work only inside the working directory.
  Write the report to report.md and stop.
