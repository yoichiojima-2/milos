# The preset agent: a general-purpose assistant. Published with
# `milos agents publish agents/general.yaml` after CI has validated it
# (`milos agents validate agents/*.yaml`).
agent_id: general
purpose: General-purpose assistant for the team's everyday tasks; reads the shared data and keeps its working tables in BigQuery.
owner: owner@example.com
allowed_groups:
  - agent-users@example.com
data_classes:
  - C1
allowed_tools:
  - Read
  - Glob
  - Grep
  - Write
  - Edit
  - Bash
  - mcp__internal__bq_tables
  - mcp__internal__bq_query
  - mcp__internal__bq_write
  - mcp__internal__bq_insert_rows
  - mcp__egress__web_fetch
approval_required:
  - Bash
  - mcp__egress__web_fetch
approval_ttl_sec: 3600
max_turns: 40
max_budget_usd: 5.0
max_concurrent_sessions: 4
model: claude-sonnet-5@20260601
runner_sa: runner-general@example-runtime-dev.iam.gserviceaccount.com
connectors:
  - internal
  - egress
# BigQuery: the shared datasets of the data project the agent may read, and
# whether it gets a dataset of its own (agent_general) to read and write.
datasets:
  - weekly_numbers
workspace: true
system_prompt: |
  You are a careful, general-purpose assistant. Do what the message asks and
  stop; ask when the task is unclear. Work only inside the working directory.
  Shared data is in the BigQuery dataset weekly_numbers; the dataset
  agent_general keeps the tables you derive in this session (other sessions'
  tables are not visible). Name tables as dataset.table.
