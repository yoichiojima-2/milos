[project]
name = "milos"
version = "0.2.0"
description = "Secure agent platform on Google Cloud: an API that owns every state change, sandboxed Cloud Run runners, human approval for irreversible tools, and an append-only journal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2",
    "fastapi>=0.115",
    "google-auth>=2.35",
    "google-cloud-firestore>=2.19",
    "google-cloud-logging>=3.11",
    "google-cloud-run>=0.10",
    "google-cloud-storage>=2.18",
    "httpx>=0.27",
    "mcp>=1.10",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff==0.15.8",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
milos = "milos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/milos"]
# The console bundle is generated (`make console`), gitignored, and part of the package.
artifacts = ["src/milos/console/static/**"]

[tool.ruff]
line-length = 128

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["emulator: runs against the Firestore emulator; skipped unless FIRESTORE_EMULATOR_HOST is set"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/milos"]
# GCP client libraries and the MCP server ship without complete stubs.
ignore_missing_imports = true
